<svg xmlns="http://www.w3.org/2000/svg" width="520" height="96" viewBox="0 0 520 96" role="img">
<defs>
  <radialGradient id="bg" cx="30%" cy="45%" r="85%">
    <stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#04060c"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
.glint { animation: glint 3.5s ease-in-out infinite; }
@keyframes glint { 0% { transform: translateX(0); } 60%, 100% { transform: translateX(720px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>



<defs><linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="pill"><rect x="8" y="8" width="504" height="80" rx="40.0"/></clipPath></defs>
<rect x="8" y="8" width="504" height="80" rx="40.0" fill="#04060c" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
<g clip-path="url(#pill)"><rect class="glint" x="-160" y="0" width="140" height="96" fill="url(#glint)"/></g>
<text x="260.0" y="55.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="6" fill="#e6f1ff">OPEN THE DASHBOARD  →</text>

</svg>
