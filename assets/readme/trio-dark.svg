<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img">
<defs>
  <radialGradient id="bg" cx="30%" cy="45%" r="85%">
    <stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#04060c"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.bar { transform-box: fill-box; transform-origin: bottom; animation: bar 2.4s ease-in-out infinite; }
@keyframes bar { 50% { transform: scaleY(.45); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1200" height="230" rx="18" fill="url(#bg)"/>
<rect width="1200" height="230" rx="18" fill="url(#grid)"/>
<g><circle cx="100" cy="115" r="26" fill="none" stroke="url(#accent)" stroke-width="2.5"/><line x1="119" y1="134" x2="136" y2="151" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><circle class="pulse" cx="100" cy="115" r="6" fill="#ff3d8b"/>
<text x="160" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="6" fill="#e6f1ff">FIND</text>
<text x="160" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#7b8aa3">every trade, every wallet</text></g><g><rect class="bar" x="454" y="101" width="9" height="14" rx="2" fill="url(#accent)" style="animation-delay:0.00s"/><rect class="bar" x="468" y="89" width="9" height="26" rx="2" fill="url(#accent)" style="animation-delay:0.25s"/><rect class="bar" x="482" y="95" width="9" height="20" rx="2" fill="url(#accent)" style="animation-delay:0.50s"/><rect class="bar" x="496" y="75" width="9" height="40" rx="2" fill="url(#accent)" style="animation-delay:0.75s"/>
<text x="540" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="6" fill="#e6f1ff">SCORE</text>
<text x="540" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#7b8aa3">nine signals, one number</text></g><g><path d="M830 137 C850 85 868 155 890 93" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="4 6"/><circle class="ride" r="6" fill="#ff3d8b"><animateMotion dur="3.2s" repeatCount="indefinite" path="M830 137 C850 85 868 155 890 93"/></circle>
<text x="920" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="6" fill="#e6f1ff">FOLLOW</text>
<text x="920" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#7b8aa3">every move, every 8 minutes</text></g>
</svg>
